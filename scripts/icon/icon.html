<!doctype html>
<meta charset="utf-8">
<title>WaveSync icon</title>
<!--
  Gera o ícone da marca a partir do monograma "w" do próprio wordmark.

  O favicon original era o logotipo horizontal inteiro em JPEG sobre fundo
  cinza-claro: ilegível a 32px e claro numa aba escura. Aqui só o "w" é
  recortado, medido por canvas no arquivo original (tinta em x 161-377,
  y 459-636 de uma imagem 1024x1024), e recolorido para claro sobre escuro.

  Como não há ImageMagick nem rasterizador SVG nesta máquina, a conversão de
  cor é feita em CSS e rasterizada com Chrome headless:
    invert + grayscale  -> o marinho vira claro e o fundo claro vira quase preto
    mix-blend-mode:screen -> o quase-preto desaparece sobre o quadrado escuro
    multiply com azul     -> tinge o glifo com a cor da marca

  Uso (a partir de frontend/public):
    CHROME=".../Google Chrome" ; "$CHROME" --headless=new --disable-gpu \
      --window-size=512,512 --screenshot=icon-512.png file://.../icon.html
-->
<style>
  html, body { margin: 0; background: #070b12; }
  body { width: 512px; height: 512px; overflow: hidden; }

  .icon {
    position: relative;
    width: 512px;
    height: 512px;
    background: #070b12;
    isolation: isolate;
    overflow: hidden;
  }

  /* O glifo "w": x 161-282, y 459-560 no original (122x102), medido por canvas.
     O corte em 282 fica no vale entre o "w" e o "a", que se conectam pelo traço
     da caligrafia e por isso não têm lacuna de coluna. Escala 2.745 leva a altura
     de 102 para 280px. */
  .glyph {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 335px;   /* 122 * 2.745 */
    height: 280px;  /* 102 * 2.745 */
    transform: translate(-50%, -50%);
    background-image: url("../../frontend/public/favicon.png");
    background-size: 2811px 2811px;       /* 1024 * 2.745 */
    background-position: -442px -1260px;  /* -(161*2.745) -(459*2.745) */
    background-repeat: no-repeat;
    filter: invert(1) grayscale(1) brightness(0.9) contrast(6);
    mix-blend-mode: screen;
  }

  /* Tinge o glifo com o azul da marca sem clarear o fundo. */
  .tint {
    position: absolute;
    inset: 0;
    background: #8ecbff;
    mix-blend-mode: multiply;
  }
</style>
<div class="icon">
  <div class="glyph"></div>
  <div class="tint"></div>
</div>
