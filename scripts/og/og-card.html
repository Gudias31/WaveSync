<!doctype html>
<meta charset="utf-8">
<title>WaveSync — OG card</title>
<!--
  Card de compartilhamento, 1200x630. Antes não existia nenhuma imagem OG, então
  o link compartilhado (principalmente no WhatsApp, que é o canal desta audiência)
  aparecia sem imagem e sem descrição.

  Autocontido de propósito: fonte de sistema e SVG inline, nada de rede, para
  rasterizar igual sempre. Gerar com:
    CHROME=".../Google Chrome" ; "$CHROME" --headless=new --disable-gpu \
      --window-size=1200,630 --screenshot=frontend/public/og-image.png \
      file://.../scripts/og/og-card.html
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #070b12;
    color: #e8eef8;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 76px 88px;
  }

  /* Mesma atmosfera do site: grid fino e um glow radial. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(80,140,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,140,255,.05) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 30% 30%, #000 25%, transparent 78%);
  }
  .glow {
    position: absolute; width: 720px; height: 720px;
    top: -240px; right: -200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(61,157,255,.42), transparent 62%);
    filter: blur(90px);
  }
  .waves { position: absolute; inset: 0; width: 1200px; height: 630px; opacity: .85; }

  .content { position: relative; max-width: 760px; }

  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 44px; }
  .brand svg { display: block; }
  .brand span { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .brand b { color: #3d9dff; }

  h1 {
    font-size: 68px;
    line-height: 1.06;
    letter-spacing: -.035em;
    font-weight: 800;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, #fff 8%, #3d9dff 52%, #8ecbff 96%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p {
    margin-top: 26px;
    font-size: 27px;
    line-height: 1.5;
    color: rgba(232,238,248,.72);
    max-width: 640px;
  }
  .foot {
    position: absolute;
    left: 88px; bottom: 60px;
    display: flex; align-items: center; gap: 16px;
    font-size: 23px; font-weight: 600; color: rgba(232,238,248,.6);
  }
  .foot i { width: 7px; height: 7px; border-radius: 50%; background: #3d9dff; display: block; }
</style>

<div class="grid"></div>
<div class="glow"></div>

<svg class="waves" viewBox="0 0 1200 630" preserveAspectRatio="none">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d9dff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#3d9dff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6450ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#w1)">
    <path d="M-40 470 q 90 -110 180 0 q 90 110 180 0 q 90 -110 180 0 q 90 110 180 0 q 90 -110 180 0 q 90 110 180 0 q 90 -110 180 0" stroke-width="2.5"/>
    <path d="M-40 520 q 90 84 180 0 q 90 -84 180 0 q 90 84 180 0 q 90 -84 180 0 q 90 84 180 0 q 90 -84 180 0 q 90 84 180 0" stroke-width="1.6"/>
    <path d="M-40 566 q 90 -62 180 0 q 90 62 180 0 q 90 -62 180 0 q 90 62 180 0 q 90 -62 180 0 q 90 62 180 0 q 90 -62 180 0" stroke-width="1.1"/>
  </g>
</svg>

<div class="content">
  <div class="brand">
    <svg width="52" height="52" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#0d1526"/>
      <g fill="none" stroke-linecap="round">
        <path d="M104 300 q 38 76 76 0 q 38 -76 76 0 q 38 76 76 0 q 38 -76 76 0" stroke="#3d9dff" stroke-opacity=".42" stroke-width="22"/>
        <path d="M104 226 q 38 -84 76 0 q 38 84 76 0 q 38 -84 76 0 q 38 84 76 0" stroke="#5cb0ff" stroke-width="44"/>
      </g>
    </svg>
    <span>WaveSync <b>Technology</b></span>
  </div>
  <h1>Sites e sistemas web<br><em>feitos sob medida</em></h1>
  <p>Do briefing ao deploy, com código próprio e acompanhamento depois da entrega.</p>
</div>

<div class="foot"><i></i>wavesynctech.com.br</div>
